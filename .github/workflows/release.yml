name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore .\TuantuanDesktopPet.sln

      - name: Set up Python for Skill tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/requirements.txt

      - name: Test bundled Skills
        run: |
          python -m pip install -r skills/requirements.txt
          python -m unittest discover -s skills/hatch-pet/tests -p "test_*.py" -v
          python -m unittest discover -s skills/hatch-desktop-pet/tests -p "test_*.py" -v

      - name: Test and publish
        shell: pwsh
        run: .\build.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/团团桌宠.exe" `
            "dist/SHA256SUMS.txt" `
            --verify-tag `
            --title "团团桌宠 ${{ github.ref_name }}" `
            --generate-notes
