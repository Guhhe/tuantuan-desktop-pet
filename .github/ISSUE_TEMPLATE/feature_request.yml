name: 功能建议
description: 提议新的交互、设置、平台兼容或宠物能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述用户场景，而不只是实现方式。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 桌宠交互
        - 宠物包与导入
        - Codex Skill
        - 构建与发布
        - 文档
        - 其他
    validations:
      required: true
